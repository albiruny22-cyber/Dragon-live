name: NYXEN DRAGON Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/Unzip.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q NYXEN-DRAGON-Android-Project-V2.zip -d extracted

          - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NYXEN-DRAGON-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
